<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XStanley — your AI Head of Content</title>
<style>
:root{
  --bg:#0a0a0f;--panel:#111116;--panel2:#18181f;--border:#26262f;
  --text:#ececf1;--muted:#9b9ba7;--accent:#7c6cff;--accent2:#a89bff;
  --green:#3fb96d;--red:#e0564f;--amber:#e0a53f;--mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,'Segoe UI',sans-serif;display:flex}
aside{width:230px;min-width:230px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:18px;letter-spacing:.3px;padding:0 10px 18px}
.logo span{color:var(--accent)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);cursor:pointer;font-size:13.5px;margin-bottom:2px;user-select:none}
.nav-item:hover{color:var(--text);background:var(--panel2)}
.nav-item.active{color:var(--text);background:var(--panel2)}
.nav-item .ic{width:18px;text-align:center}
.mode-chip{margin:auto 10px 4px;font:11px var(--mono);padding:4px 9px;border:1px solid var(--border);border-radius:20px;color:var(--muted);text-align:center}
main{flex:1;overflow-y:auto;padding:26px 30px;max-width:1060px}
h2.page{font-size:19px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:23px}
.stat small{color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.green{background:var(--green);border-color:var(--green);color:#fff}
button.btn.danger{color:var(--red);border-color:var(--red);background:none}
button.btn:disabled{opacity:.45;cursor:default}
.meta{font-size:12px;color:var(--muted);margin-top:8px}
.meta .tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);margin-right:6px}
.post-text{white-space:pre-wrap;font-size:14.5px}
textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:11px;font:14px/1.5 system-ui;resize:vertical}
input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:7px 10px;font-size:13px}
.loopbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);font-weight:600}
.log-line{font:12px var(--mono);padding:4px 0;border-bottom:1px solid #15151c;display:flex;gap:10px}
.log-line .loop{color:var(--accent2);min-width:70px}
.log-line .warn,.log-line .error{color:var(--amber)}
h3.sec{font-size:13px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px}
.settings-row{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.settings-row label{min-width:190px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:34px 0}
.thread-part{opacity:.92;margin-top:8px;padding-left:12px;border-left:2px solid var(--border)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--accent);padding:11px 17px;border-radius:10px;opacity:0;transition:.25s;z-index:50}
#toast.show{opacity:1}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 52px);margin:-4px -6px}
.chat-scroll{flex:1;overflow-y:auto;padding:6px 6px 12px}
.bubble{max-width:76%;padding:11px 15px;border-radius:16px;margin-bottom:10px;white-space:pre-wrap;font-size:14px;line-height:1.55}
.bubble.user{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bubble.stanley{background:var(--panel2);border:1px solid var(--border);border-bottom-left-radius:5px}
.bubble.stanley .quote{border-left:3px solid var(--accent);padding:6px 11px;margin:7px 0;background:#14141b;border-radius:7px;color:#d9d9e3;font-size:13.5px}
.chat-input-row{display:flex;gap:9px;padding:12px 6px 0;border-top:1px solid var(--border);align-items:flex-end}
.chat-input-row textarea{min-height:46px;max-height:150px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 8px}
.chip{font-size:12px;padding:4px 11px;border:1px solid var(--border);border-radius:16px;color:var(--accent2);cursor:pointer;background:var(--panel)}
.chip:hover{border-color:var(--accent)}
.sender{font:11px var(--mono);color:var(--muted);margin:0 0 3px 6px}
.sender.right{margin:0 6px 3px auto;text-align:right}
/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-day{min-height:96px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px}
.cal-day.today{border-color:var(--accent)}
.cal-day .dnum{font:12px var(--mono);color:var(--muted);margin-bottom:5px}
.cal-item{font-size:11.5px;padding:4px 7px;border-radius:6px;margin-bottom:4px;background:var(--panel2);border-left:2px solid var(--accent);cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cal-item.published{border-left-color:var(--green)}
.cal-item .t{color:var(--muted);font:10px var(--mono)}
/* strategy */
.strat-body{white-space:pre-wrap;font-size:14px;line-height:1.65}
.strat-body h{font-weight:700;color:var(--accent2);display:block;margin:18px 0 6px}
</style>
</head>
<body>
<aside>
  <div class="logo">X<span>Stanley</span></div>
  <div class="nav-item active" data-tab="write"><span class="ic">✍️</span>Write</div>
  <div class="nav-item" data-tab="calendar"><span class="ic">📅</span>Calendar</div>
  <div class="nav-item" data-tab="inbox"><span class="ic">📥</span>Inbox</div>
  <div class="nav-item" data-tab="ideas"><span class="ic">💡</span>Ideas</div>
  <div class="nav-item" data-tab="strategy"><span class="ic">🎯</span>Strategy</div>
  <div class="nav-item" data-tab="insights"><span class="ic">📈</span>Insights</div>
  <div class="nav-item" data-tab="connect"><span class="ic">🔗</span>Connect</div>
  <div class="nav-item" data-tab="settings"><span class="ic">⚙️</span>Settings</div>
  <div class="nav-item" data-tab="log"><span class="ic">📜</span>Log</div>
  <div class="mode-chip" id="mode-badge">…</div>
</aside>
<main id="main"><div class="empty">loading…</div></main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = async (path, opts) => {
  const r = await fetch('/api/' + path, opts ? {headers:{'Content-Type':'application/json'},...opts} : undefined);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.json();
};
const esc = s => (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
async function act(path, msg){ try{ await api(path,{method:'POST'}); toast(msg||'done'); load(); }catch(e){ toast('error: '+e.message);} }
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';

let tab = 'write';
document.querySelectorAll('.nav-item').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));
  load();
});

function draftCard(d, kind){
  const threadHtml = (d.thread||[]).slice(1).map(t=>`<div class="thread-part">${esc(t)}</div>`).join('');
  const src = d.meta?.idea_title ? `<span class="tag">💡 ${esc(d.meta.idea_title)}</span>` : '';
  const temp = d.temperature ? `<span class="tag">${esc(d.temperature)}</span>` : '';
  const sched = d.scheduled_at ? `<span class="tag">⏰ ${fmtTime(d.scheduled_at)}</span>` : '';
  if (kind === 'reply'){
    return `<div class="card" style="border-left:3px solid var(--amber)" id="d${d.id}">
      <div class="meta" style="margin:0 0 8px"><span class="tag">↩ reply to ${esc(d.meta?.author||'')}</span></div>
      <div class="post-text" id="t${d.id}">${esc(d.text)}</div>
      <div class="actions">
        <button class="btn primary" onclick="sendReply(${d.id})">Send</button>
        <button class="btn" onclick="editDraft(${d.id})">Edit</button>
        <button class="btn danger" onclick="act('drafts/${d.id}/reject','discarded')">Discard</button>
      </div></div>`;
  }
  return `<div class="card" id="d${d.id}">
    ${src}${temp}${sched}
    <div class="post-text" id="t${d.id}" style="margin-top:6px">${esc(d.text)}</div>${threadHtml}
    <div class="actions">
      <button class="btn green" onclick="approve(${d.id})">Approve</button>
      <button class="btn" onclick="editDraft(${d.id})">Edit</button>
      <button class="btn danger" onclick="act('drafts/${d.id}/reject','discarded')">Discard</button>
    </div></div>`;
}

window.approve = async id => { try{ const r=await api(`drafts/${id}/approve`,{method:'POST',body:'{}'}); toast('approved → scheduled '+fmtTime(r.scheduled_at)); load(); }catch(e){toast('error: '+e.message);} };
window.editDraft = async id => {
  const el = $('#t'+id); if (!el) return;
  if (el.dataset.editing) return; el.dataset.editing = 1;
  const orig = el.textContent;
  el.outerHTML = `<textarea id="edit${id}">${esc(orig)}</textarea>
   <div class="actions"><button class="btn primary" onclick="saveEdit(${id})">Save</button>
   <button class="btn" onclick="cancelEdit(${id})">Cancel</button></div>`;
};
window.cancelEdit = id => { load(); };
window.saveEdit = async id => {
  const v = $('#edit'+id).value;
  try{ await api(`drafts/${id}/edit`,{method:'POST',body:JSON.stringify({text:v})}); toast('saved'); load(); }catch(e){toast('error: '+e.message);} };
window.sendReply = async id => { try{ const r=await api(`replies/${id}/send`,{method:'POST',body:'{}'}); toast('sent ✓ '+(r.dry_run?'(dry-run)':'')); load(); }catch(e){toast('error: '+e.message);} };
window.runLoop = async name => {
  toast('running '+name+' …');
  try{ const r = await api('loops/'+name,{method:'POST',body:'{}'}); toast(name+' done ✓ '+JSON.stringify(r.result).slice(0,90)); load(); }
  catch(e){ toast('error: '+e.message); }
};

// ---------------- WRITE (chat-first) ----------------
let chatBusy = false;
window.sendChat = async () => {
  if (chatBusy) return;
  const ta = $('#chat-in');
  const msg = ta.value.trim();
  if (!msg) return;
  chatBusy = true; ta.value = '';
  const scroll = $('#chat-scroll');
  scroll.insertAdjacentHTML('beforeend', `<div><div class="sender right">You</div><div class="bubble user">${esc(msg)}</div></div>`);
  scroll.scrollTop = scroll.scrollHeight;
  try{
    const r = await api('chat',{method:'POST',body:JSON.stringify({message:msg})});
    const chips = (r.actions||[]).map(a=>`<span class="chip" onclick="runLoop('${a.id}')">${esc(a.label)}</span>`).join('');
    scroll.insertAdjacentHTML('beforeend', `<div><div class="sender">Stanley · AI Head of Content</div><div class="bubble stanley">${fmtStanley(r.reply)}${chips?`<div class="chips">${chips}</div>`:''}</div></div>`);
    scroll.scrollTop = scroll.scrollHeight;
  }catch(e){
    scroll.insertAdjacentHTML('beforeend', `<div class="bubble stanley">error: ${esc(e.message)}</div>`);
  }
  chatBusy = false;
};
function fmtStanley(text){
  // turn quoted post lines into styled blocks
  return esc(text).split('\n').map(l => l.trim().startsWith('>') ? `<div class="quote">${l.replace(/^>\s?/,'')}</div>` : l).join('\n');
}
window.draftFromChat = async () => {
  const ta = $('#chat-in');
  const msg = ta.value.trim();
  if (!msg){ toast('type or paste the post text first'); return; }
  try{ const r = await api('chat/draft',{method:'POST',body:JSON.stringify({text:msg})}); toast('saved as draft #'+r.draft_id+' → Inbox'); tab='inbox'; document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.tab==='inbox')); load(); }
  catch(e){ toast('error: '+e.message); }
};

async function load(){
  const main = $('#main');
  try{
    if (tab === 'write'){
      const hist = await api('chat/history');
      const bubbles = hist.map(h => h.role==='user'
        ? `<div><div class="sender right">You</div><div class="bubble user">${esc(h.content)}</div></div>`
        : `<div><div class="sender">Stanley · AI Head of Content</div><div class="bubble stanley">${fmtStanley(h.content)}</div></div>`).join('');
      main.innerHTML = `
        <div class="chat-wrap">
          <div class="chat-scroll" id="chat-scroll">
            ${hist.length ? bubbles : `<div class="bubble stanley">Hey Fadi — I'm Stanley, your AI Head of Content.<br><br>I've studied your niche and voice. Ask me to write a post, critique your drafts, plan the week, or check what's landing. I draft everything in <b>your</b> voice — you approve, it ships.<br><br>Try: <i>"write a post about shipping fast"</i> or <i>"what should I post this week?"</i></div>`}
          </div>
          <div class="chat-input-row">
            <textarea id="chat-in" placeholder="Ask Stanley anything — 'write a post about…', 'what's working?', 'plan my week'"></textarea>
            <div style="display:flex;flex-direction:column;gap:6px">
              <button class="btn primary" onclick="sendChat()">Send ↵</button>
              <button class="btn" onclick="draftFromChat()" title="Save the text box as an approvable draft">Save as draft</button>
            </div>
          </div>
        </div>`;
      const ta = $('#chat-in');
      ta.onkeydown = e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } };
      const sc = $('#chat-scroll'); sc.scrollTop = sc.scrollHeight;
    } else if (tab === 'calendar'){
      const cal = await api('calendar');
      const today = new Date(); today.setHours(0,0,0,0);
      // build week grid (Mon-Sun) around today
      const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay()+6)%7));
      let cells = '';
      for (let i=0;i<14;i++){
        const d = new Date(mon); d.setDate(mon.getDate()+i);
        const key = d.toISOString().slice(0,10);
        const items = (cal.days[key]||[]).map(x=>`
          <div class="cal-item ${x.state}" onclick="location.hash='';toast('draft #${x.id}')">
            <span class="t">${(x.scheduled_at||x.published_at||'').slice(11,16)}</span> ${esc(x.text.slice(0,60))}
          </div>`).join('');
        cells += `<div class="cal-day ${key===today.toISOString().slice(0,10)?'today':''}">
          <div class="dnum">${d.toLocaleDateString('en-GB',{weekday:'short'})} ${d.getDate()}</div>${items}</div>`;
      }
      main.innerHTML = `
        <h2 class="page">Content Calendar</h2>
        <p class="sub">Two-week view · green = published · purple = scheduled</p>
        <div class="cal-grid">${cells}</div>
        <h3 class="sec">Queue controls</h3>
        <div class="loopbar">${['create','publish','study','engage','learn','import'].map(l=>`<button class="btn" onclick="runLoop('${l}')">${l}</button>`).join('')}</div>`;
    } else if (tab === 'inbox'){
      const [stats, drafts] = await Promise.all([api('stats'), api('drafts?status=draft')]);
      const rlist = drafts.filter(d=>d.kind==='reply'), plist = drafts.filter(d=>d.kind==='post');
      main.innerHTML = `
        <div class="grid">
          <div class="stat"><b>${stats.drafts.draft||0}</b><small>pending drafts</small></div>
          <div class="stat"><b>${stats.new_engagements||0}</b><small>new mentions</small></div>
          <div class="stat"><b>${stats.ideas_bank||0}</b><small>idea bank</small></div>
          <div class="stat"><b>${stats.drafts.published||0}</b><small>published</small></div>
        </div>
        ${rlist.length?`<h3 class="sec">Reply drafts</h3>${rlist.map(d=>draftCard(d,'reply')).join('')}`:''}
        <h3 class="sec">Post drafts</h3>
        ${plist.length ? plist.map(d=>draftCard(d)).join('') : '<div class="empty">no drafts — ask Stanley on the Write screen, or run “create”</div>'}`;
    } else if (tab === 'ideas'){
      const list = await api('ideas');
      main.innerHTML = `<h2 class="page">Idea Bank</h2><p class="sub">scored angles distilled from your niche + voice</p>` +
        (list.length ? list.map(i=>`
        <div class="card"><b>${esc(i.title)}</b>
          <div class="meta">${esc(i.angle)}</div>
          <div class="meta"><span class="tag">${esc(i.format)}</span><span class="tag">score ${i.score.toFixed?i.score.toFixed(1):i.score}</span><span class="tag">${esc(i.source||'')}</span></div>
          <div class="actions"><button class="btn" onclick="askFromIdea(${i.id})">Ask Stanley to write it</button><button class="btn danger" onclick="act('ideas/${i.id}/discard','discarded')">Discard</button></div>
        </div>`).join('') : '<div class="empty">story bank empty — run “study”</div>');
    } else if (tab === 'strategy'){
      let s; try { s = await api('strategy'); } catch(e){ s = {}; }
      main.innerHTML = `
        <h2 class="page">X Strategy</h2>
        <p class="sub">one-pager Stanley maintains from your real data — regenerates after each import/learn</p>
        <div class="actions" style="margin-bottom:16px">
          <button class="btn primary" onclick="genStrategy(false)">Generate / Show</button>
          <button class="btn" onclick="genStrategy(true)">Force regenerate</button>
        </div>
        <div class="card strat-body" id="strat-body">${s.text ? fmtStrat(s.text) : '<div class="empty">no strategy yet — hit Generate (needs imported history)</div>'}</div>`;
    } else if (tab === 'insights'){
      const a = await api('analytics');
      if (!a.posts.length){ main.innerHTML = '<div class="empty">no data — import history first (Connect tab)</div>'; return; }
      const s = a.summary; const mx = Math.max(...a.posts.map(p=>p.likes+p.reposts),1);
      main.innerHTML = `
        <h2 class="page">Insights</h2><p class="sub">what's landing on your account</p>
        <div class="grid">
          <div class="stat"><b>${s.total_impressions.toLocaleString()}</b><small>impressions (last ${a.posts.length})</small></div>
          <div class="stat"><b>${s.total_engagement.toLocaleString()}</b><small>engagement (w)</small></div>
          <div class="stat"><b>${(s.avg_engagement_rate*100).toFixed(2)}%</b><small>eng. rate</small></div>
        </div>
        <h3 class="sec">Recent posts</h3>
        ${a.posts.slice(0,25).map(p=>`
          <div class="card"><div class="post-text">${esc(p.text.slice(0,160))}</div>
            <div class="meta">♥ ${p.likes} · ⇄ ${p.reposts} · 💬 ${p.replies} · 👁 ${p.impressions||'—'} · ${fmtTime(p.created_at)}</div>
            <div class="bar"><i style="width:${Math.min(100,(p.likes+p.reposts)/mx*100)}%"></i></div>
          </div>`).join('')}`;
    } else if (tab === 'connect'){
      let st;
      try { st = await api('x/status'); } catch(e){ st = {mode:'?', safety:{caps:{},usage:{}}}; }
      const caps = st.safety?.caps || {}, usg = st.safety?.usage || {};
      main.innerHTML = `
        <h2 class="page">Connect X</h2>
        <p class="sub">account + safety settings</p>
        <div class="card">
          <div class="meta" style="margin:0 0 10px">
            mode: <b>${esc(st.mode)}</b>${st.username?` · account: <b>@${esc(st.username)}</b>`:''}${st.followers!=null?` · ${st.followers} followers`:''} · cookies: ${st.cookies_set?'✅ set':'—'}
          </div>
          <div class="meta" style="margin:0 0 10px">Safety today: ${usg.posts||0}/${caps.max_posts_per_day||'?'} posts · ${usg.replies||0}/${caps.max_replies_per_day||'?'} replies</div>
          <div class="settings-row"><label>max posts / day</label><input type=number id=c_mp value="${caps.max_posts_per_day||4}" style="width:80px"></div>
          <div class="settings-row"><label>max replies / day</label><input type=number id=c_mr value="${caps.max_replies_per_day||10}" style="width:80px"></div>
          <div class="settings-row"><label>delay between posts (s)</label><input type=number id=c_mn value="${caps.min_delay_s||5}" style="width:70px"> – <input type=number id=c_mx value="${caps.max_delay_s||20}" style="width:70px"></div>
          <div class="actions"><button class="btn primary" onclick="saveSafety()">Save safety</button></div>
        </div>
        <h3 class="sec">Connect with cookies (free)</h3>
        <div class="card">
          <div class="meta" style="margin:0 0 8px">1. Log in to <b>x.com</b> in your browser (Edge/Chrome)</div>
          <div class="meta" style="margin:0 0 8px">2. Press <b>F12</b> → <b>Application</b> tab → <b>Cookies</b> → <code>https://x.com</code></div>
          <div class="init" style="margin:0 0 8px">3. Find <code>auth_token</code> — copy its <b>Value</b> (a long hex string)</div>
          <div class="meta" style="margin:0 0 8px">4. Also grab <code>ct0</code> the same way (optional but recommended)</div>
          <div class="meta" style="margin:0 0 10px">5. Paste as JSON: <code>{"auth_token":"...","ct0":"..."}</code></div>
          <textarea id="ck_json" placeholder='{"auth_token":"abc123...","ct0":"xyz..."}' style="min-height:90px"></textarea>
          <div class="actions">
            <button class="btn green" onclick="connectCookies()">Connect & validate</button>
            <span class="meta" id="ck_msg" style="margin:0"></span>
          </div>
          <div class="meta" style="margin-top:10px">⚠ Cookie mode is unofficial (violates X ToS). Safety caps keep activity human-like; use a burner account if cautious. Cookies stay local in <code>.env</code>.</div>
        </div>
        <h3 class="sec">Import history</h3>
        <div class="card">
          <div class="meta" style="margin:0 0 10px">Pulls your recent posts + niche scan → feeds voice learning + strategy. Run after connecting.</div>
          <div class="actions"><button class="btn primary" onclick="runLoop('import')">Run import</button>
          <button class="btn" onclick="runLoop('learn')">Rebuild voice</button></div>
        </div>`;
    } else if (tab === 'settings'){
      const s = await api('settings');
      main.innerHTML = `<h2 class="page">Settings</h2><div class="card">
        <div class="settings-row"><label>daily draft target</label><input type=number id=s_ddt value="${s.daily_draft_target}" style="width:90px"></div>
        <div class="settings-row"><label>post times (HH:MM, comma)</label><input type=text id=s_pt value="${esc(s.post_times.join(', '))}" style="width:260px"></div>
        <div class="settings-row"><label>niche accounts (comma)</label><input type=text id=s_na value="${esc(s.niche_accounts.join(', '))}" style="width:320px"></div>
        <div class="settings-row"><label>evergreen themes (comma)</label><input type=text id=s_et value="${esc(s.evergreen_themes.join(', '))}" style="width:320px"></div>
        <div class="meta">X mode: <b>${esc(s.x_mode)}</b> · LLM: <b>${esc(s.llm_model)}</b> @ ${esc(s.llm_base_url)}</div>
        <div class="meta">Credentials live in <code>.env</code> / environment — never editable here.</div>
        <div class="actions"><button class="btn primary" onclick="saveSettings()">Save</button></div></div>`;
    } else if (tab === 'log'){
      const rows = await api('log');
      main.innerHTML = `<h2 class="page">Agent Log</h2><div class="card" style="padding:10px 14px">` +
        rows.map(r=>`<div class="log-line"><span>${fmtTime(r.ts)}</span><span class="${esc(r.level)} loop">${esc(r.loop)}</span><span>${esc(r.message)}</span></div>`).join('') + '</div>';
    }
  }catch(e){ main.innerHTML = `<div class="empty">error: ${esc(e.message)} — is the server fresh? try /api/health</div>`; }
}

window.askFromIdea = id => {
  tab='write'; document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.tab==='write'));
  load().then(()=>{ const ta=$('#chat-in'); if(ta){ ta.value = `Write a post from idea #${id}. Check the idea bank for its title and angle.`; ta.focus(); }});
};
window.genStrategy = async force => {
  toast('Stanley is drafting your strategy… (may take ~30s)');
  try{ await api('strategy'+(force?'?force=true':''),{method:'POST',body:'{}'}); toast('strategy ready'); load(); }
  catch(e){ toast('error: '+e.message); }
};
function fmtStrat(text){
  const heads = ['Strategic Goal','Target Audience','Positioning Line','Content Pillars','Core Message','Voice & Style','Cadence & Formats'];
  let html = esc(text);
  heads.forEach(h => { html = html.replace(new RegExp('^'+h+'\\s*$','m'), '<h>'+h+'</h>'); });
  return html;
}
window.saveSettings = async () => {
  const val = id => $(id).value.trim();
  const body = {
    daily_draft_target: parseInt(val('#s_ddt'))||4,
    post_times: val('#s_pt').split(',').map(x=>x.trim()).filter(Boolean),
    niche_accounts: val('#s_na').split(',').map(x=>x.trim().replace(/^@/,'')).filter(Boolean),
    evergreen_themes: val('#s_et').split(',').map(x=>x.trim()).filter(Boolean),
  };
  try{ await api('settings',{method:'POST',body:JSON.stringify(body)}); toast('settings saved'); }catch(e){toast('error: '+e.message);} };
window.saveSafety = async () => {
  const body = {
    max_posts_per_day: parseInt($('#c_mp').value)||4,
    max_replies_per_day: parseInt($('#c_mr').value)||10,
    min_delay_s: parseInt($('#c_mn').value)||5,
    max_delay_s: parseInt($('#c_mx').value)||20,
  };
  try{ await api('x/safety',{method:'POST',body:JSON.stringify(body)}); toast('safety saved'); load(); }catch(e){toast('error: '+e.message);} };
window.connectCookies = async () => {
  const btn = document.querySelector('button[onclick="connectCookies()"]');
  const msg = $('#ck_msg');
  msg.textContent = 'validating with x.com …'; if(btn) btn.disabled = true;
  try{
    const r = await api('x/cookie-connect',{method:'POST',body:JSON.stringify({cookies_json:$('#ck_json').value})});
    msg.textContent = `✅ connected @${r.username} (${r.followers} followers)`;
    toast('X connected: @'+r.username);
    setTimeout(load, 600);
    api('health').then(h=>{ $('#mode-badge').textContent = h.mode.toUpperCase()+' MODE'; }).catch(()=>{});
  }catch(e){
    msg.textContent = '❌ ' + e.message;
    if(btn) btn.disabled = false;
  }
};

api('health').then(h=>{ $('#mode-badge').textContent = h.mode === 'dryrun' ? 'DRY-RUN MODE' : h.mode.toUpperCase()+' MODE'; }).catch(()=>{});
load();
setInterval(()=>{ if (!document.querySelector('[id^=edit]') && !chatBusy && document.visibilityState==='visible') load(); }, 15000);
</script>
</body>
</html>
